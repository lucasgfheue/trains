# Memoria que usa Gradle al compilar
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Mapeos Parchment (nombres legibles de parametros)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Versiones de Minecraft y NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# Version de NeoForge contra la que se compila (la de la plantilla oficial)
neo_version=21.1.262
# Version minima de NeoForge que necesita el jugador para usar el mod
neo_version_range=[21.1.0,)
loader_version_range=[1,)

## Datos del mod
mod_id=locomotora
mod_name=Locomotora de Vapor
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.locomotora
mod_authors=nosequep90
