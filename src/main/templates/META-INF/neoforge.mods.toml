modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="locomotora.png"
description='''
Tres locomotoras de vapor de hasta 3 bloques de alto que andan sobre los rieles de Minecraft:
la Clásica del Oeste, el Expreso Europeo y el Gigante de Carga.
Se cargan con carbón, tienen marchas (incluida marcha atrás), silbato, humo, ruedas y bielas animadas,
y empujan las vagonetas que tengan delante.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
