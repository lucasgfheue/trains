modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="locomotora.png"
description='''
Siete locomotoras de hasta 3 bloques de alto que andan sobre los rieles de Minecraft.
Vapor (carbón): Clásica del Oeste, Expreso Europeo y Gigante de Carga.
Diésel (bidón de diésel): Aerodinámica Americana, Road Switcher, Europea Moderna y Maniobras.
Tienen marchas (incluida marcha atrás), silbato o bocina, humo, ruedas animadas y empujan las vagonetas que tengan delante.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
